version: 2
project_name: lsp-trace
builds:
  - id: lsp-trace
    main: ./cmd/lsp-trace
    binary: lsp-trace
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
  - id: lsp-trace-mcp
    main: ./cmd/lsp-trace-mcp
    binary: lsp-trace-mcp
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
checksum:
  name_template: checksums.txt
changelog:
  disable: true
