name: CI
on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
      - name: Install pinned Pi MCP adapter runtime
        run: npm install --prefix "$HOME/.pi/agent/npm" --no-save pi-mcp-adapter@2.32.1 @earendil-works/pi-coding-agent@0.84.1 @earendil-works/pi-ai@0.84.1 typebox@1.3.3
      - name: Check formatting
        run: ./scripts/check-go-format.sh
      - name: Check Python syntax
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m py_compile scripts/retain-qualification.py scripts/check-program-c-profiles.py scripts/test-program-c-profiles.py scripts/check-program-c-gate-ii.py scripts/test-program-c-gate-ii.py scripts/check-program-c-gate-ii-v4.py scripts/test-program-c-gate-ii-v4.py scripts/check-ci-shards.py scripts/generate-ci-shards.py scripts/map-ci-affected-packages.py scripts/summarize-go-test-json.py scripts/check-ci-topology.py scripts/test-ci-shards.py scripts/test-ci-affected-packages.py scripts/test-summarize-go-test-json.py scripts/test-ci-topology.py
      - name: Check Program C profiles
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 scripts/test-program-c-profiles.py
          python3 scripts/test-program-c-documentary-sources.py
          python3 scripts/test-program-c-gate-ii.py
          python3 scripts/test-program-c-gate-ii-v4.py
          python3 scripts/check-program-c-gate-ii-v4.py --root . --outcomes qualification/program-c/gate-ii-current-outcomes.v4.tsv --receipt qualification/program-c/gate-ii-current-outcomes.v4.4403719.receipt.json
      - name: Check shell syntax
        run: sh -n scripts/qualify.sh scripts/release-check.sh scripts/check-ci.sh scripts/check-go-format.sh
      - name: Check CI contract
        run: ./scripts/check-ci.sh
      - name: Check release contract and retained evidence
        run: ./scripts/release-check.sh
      - name: Check repository cleanliness
        run: test -z "$(git status --porcelain)"

  elixir-companion:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elixir-call-hierarchy
    steps:
      - uses: actions/checkout@v4
      - name: Check out Elixir call hierarchy companion
        uses: actions/checkout@v4
        with:
          repository: jaresty/elixir-call-hierarchy
          ref: 7e97dc18a6d6d414b3bd4801eb0096031c49488a
          path: elixir-call-hierarchy
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '25.3.2.7'
          elixir-version: '1.16.2'
      - uses: actions/cache@v4
        with:
          path: |
            elixir-call-hierarchy/deps
            elixir-call-hierarchy/_build
          key: ${{ runner.os }}-elixir-1.16.2-otp-25.3.2.7-${{ hashFiles('elixir-call-hierarchy/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-elixir-1.16.2-otp-25.3.2.7-
      - run: mix deps.get --only test
      - run: mix format --check-formatted
      - run: mix test
      - run: MIX_ENV=prod mix deps.get --only prod
      - run: MIX_ENV=prod mix escript.build
      - run: python3 test/escript_integration.py

  test-linux:
    strategy:
      fail-fast: false
      matrix:
        shard:
          - {id: linux-1, needs_gopls: false}
          - {id: linux-2, needs_gopls: false}
          - {id: linux-3, needs_gopls: false}
          - {id: linux-4, needs_gopls: false}
          - {id: linux-5, needs_gopls: false}
    runs-on: ubuntu-latest
    env:
      PLATFORM: linux
    steps: &shard-steps
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Validate manifest and resolve packages
        id: packages
        shell: bash
        run: |
          python3 scripts/check-ci-shards.py
          packages=$(python3 scripts/check-ci-shards.py --platform "$PLATFORM" --shard "${{ matrix.shard.id }}" | tail -1)
          test -n "$packages"
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
      - name: Install pinned gopls
        if: matrix.shard.needs_gopls
        run: go install golang.org/x/tools/gopls@v0.23.0
      - name: Run shard once and summarize
        shell: bash
        run: |
          set +e
          set -o pipefail
          telemetry_dir=$(mktemp -d "$RUNNER_TEMP/go-test-${{ matrix.shard.id }}-XXXXXX")
          go_test_json="$telemetry_dir/go-test.json"
          go_test_summary="$telemetry_dir/go-test-summary.json"
          go test -json -timeout=10m ${{ steps.packages.outputs.packages }} 2>&1 | tee "$go_test_json"
          statuses=("${PIPESTATUS[@]}")
          test_status=${statuses[0]}
          tee_status=${statuses[1]}
          python3 scripts/summarize-go-test-json.py --input "$go_test_json" --output "$go_test_summary" --os "$PLATFORM" --commit "$GITHUB_SHA" --job "$GITHUB_JOB" --shard "${{ matrix.shard.id }}" --exit-code "$test_status"
          summary_status=$?
          if [ "$test_status" -ne 0 ]; then exit "$test_status"; fi
          if [ "$tee_status" -ne 0 ]; then exit "$tee_status"; fi
          exit "$summary_status"
      - name: Upload shard timing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-test-${{ matrix.shard.id }}
          path: |
            ${{ runner.temp }}/go-test-*/go-test.json
            ${{ runner.temp }}/go-test-*/go-test-summary.json

  test-darwin:
    strategy:
      fail-fast: false
      matrix:
        shard:
          - {id: darwin-1, needs_gopls: true}
          - {id: darwin-2, needs_gopls: false}
          - {id: darwin-3, needs_gopls: false}
          - {id: darwin-4, needs_gopls: false}
    runs-on: macos-latest
    env:
      PLATFORM: darwin
    steps: *shard-steps

  unix-vet-build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go build ./...

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go build ./...

  repository-qualified:
    if: always()
    needs: [quality, elixir-companion, test-linux, test-darwin, unix-vet-build, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Require every qualification job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = json.loads(os.environ["RESULTS"])
          bad = {name: value["result"] for name, value in results.items() if value["result"] != "success"}
          if bad:
              print(f"required jobs did not succeed: {bad}", file=sys.stderr)
              raise SystemExit(1)
          print("repository qualified")
          PY
