name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Check Python syntax
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m py_compile scripts/retain-qualification.py
      - name: Check shell syntax
        run: sh -n scripts/qualify.sh scripts/release-check.sh scripts/check-ci.sh
      - name: Check CI contract
        run: ./scripts/check-ci.sh
      - name: Check release contract and retained evidence
        run: ./scripts/release-check.sh
      - name: Check repository cleanliness
        run: test -z "$(git status --porcelain)"

  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./...
